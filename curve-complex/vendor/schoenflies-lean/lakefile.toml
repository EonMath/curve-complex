name = "schoenflies-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Schoenflies"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "3f6737de4761ec7bf368491fe9faccc991ebd6ca"

[[lean_lib]]
name = "Schoenflies"

# The trusted challenge and actual solution modules used by leanprover/comparator.
# These are not default targets, so the intentional challenge `sorry` does not
# enter the ordinary library build or axiom audit. Keeping them as separate Lean
# libraries matches Comparator's challenge/solution trust boundary.
[[lean_lib]]
name = "Challenge"
srcDir = "Comparator"

[[lean_lib]]
name = "Solution"
srcDir = "Comparator"
