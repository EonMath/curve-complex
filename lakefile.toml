[[lean_lib]]
name = "CurveComplexProofs"
srcDir = "curve-complex"
roots = []
globs = ["ClassificationJordanCurve.*", "ClassificationOfSurfaces.+", "ClassificationSchoenflies.+", "CurveComplexGenusTwo.+"]

