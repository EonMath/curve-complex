name = "curve_complex"
version = "0.1.0"
defaultTargets = ["MainTheorems"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "3f6737de4761ec7bf368491fe9faccc991ebd6ca"

[[require]]
name = "schoenflies-lean"
path = "curve-complex/vendor/schoenflies-lean"

[[lean_lib]]
name = "MainTheorems"
roots = ["MainTheorems"]
